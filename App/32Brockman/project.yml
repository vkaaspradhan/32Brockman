name: 32Brockman
options:
  bundleIdPrefix: com.brockman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages: {}
targets:
  32Brockman:
    type: application
    platform: iOS
    sources:
      - path: 32Brockman
    info:
      path: 32Brockman/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brockman.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_FILE: 32Brockman/Info.plist
        SWIFT_EMIT_LOC_STRINGS: "YES"
