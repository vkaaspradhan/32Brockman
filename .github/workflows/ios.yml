name: iOS Build & Verify

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: App/32Brockman
        run: xcodegen generate
      - name: Build for iOS Simulator (compiles every Swift file)
        working-directory: App/32Brockman
        run: xcodebuild build -project 32Brockman.xcodeproj -target 32Brockman -sdk iphonesimulator -configuration Debug -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
